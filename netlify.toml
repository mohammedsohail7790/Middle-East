# www.hallaai.com — static marketing site
# Set HALLA_APP_URL to your Netlify *app* site URL (apps/dashboard deploy).

[build]
  base = "marketing"
  publish = "."
  command = "node scripts/write-hallaai-config.mjs"

[build.environment]
  NODE_VERSION = "20"
  # After you deploy apps/dashboard on a second Netlify site, paste its URL here or in Netlify UI env vars:
  HALLA_APP_URL = "https://app.hallaai.com"
