# www.hallaai.com — Halla AI static marketing site
# Deploy: Netlify → New site → connect repo → set base to "apps/dashboard/public"
#
# The marketing SPA (index.html + hallaai_main.js + hallaai_styles.css) lives in
# apps/dashboard/public/ (generated by scripts/sync-marketing.mjs).
# Netlify serves it as a static site. All CTAs link to app.hallaai.com.

[build]
  base    = "apps/dashboard/public"
  publish = "."
  command = "echo 'Static files ready'"

[build.environment]
  NODE_VERSION  = "20"
  HALLA_APP_URL = "https://app.hallaai.com"

# SPA fallback — all paths serve index.html so the JS router handles sub-paths
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Hard redirect: /login and /signup → real app (Vercel)
[[redirects]]
  from   = "/login"
  to     = "https://app.hallaai.com/login"
  status = 301
  force  = true

[[redirects]]
  from   = "/signup"
  to     = "https://app.hallaai.com/signup"
  status = 301
  force  = true

[[redirects]]
  from   = "/dashboard"
  to     = "https://app.hallaai.com/dashboard"
  status = 301
  force  = true

# Security + cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "SAMEORIGIN"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"

[[headers]]
  for = "/hallaai_main.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hallaai_styles.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hallaai-marketing.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
