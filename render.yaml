# Halla AI — Render Blueprint (production)
# Domain: hallaai.com | Market: GCC / Middle East
# deploy-refresh: 2026-08-12
# Deploy: Render Dashboard → New → Blueprint → connect this repo
#
# Services created:
#   halla-ai-gateway  — API + Twilio webhooks + WebSocket voice (Render)
#   halla-ai-redis    — Redis for cache, sessions, queues
#
# Dashboard (app): deploy on Vercel → app.hallaai.com
# Marketing site:  deploy on Netlify → www.hallaai.com

services:
  - type: web
    name: halla-ai-gateway
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm install && npm run build:gateway
    startCommand: npm run start:gateway
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: PGSSLMODE
        value: require
      - key: ENABLE_VOICE_AGENT
        value: "true"
      - key: ENABLE_KNOWLEDGE_INGESTION
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_MS
        value: 5000
      - key: VOICE_SILENCE_TIMEOUT_MS
        value: 800
      - key: VOICE_MAX_CALL_DURATION_MS
        value: 900000
      - key: VOICE_MAX_TOKENS_PER_CALL
        value: 5000
      - key: VOICE_MAX_SILENCE_PROMPTS
        value: 3
      - key: VOICE_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: VOICE_RATE_LIMIT_MAX
        value: 60
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: VOICE_WS_ALLOWED_IPS
        value: ""
      - key: TWILIO_ALLOWED_IPS
        value: ""
      # Halla AI production domains
      - key: ALLOWED_ORIGINS
        value: https://www.hallaai.com,https://hallaai.com,https://app.hallaai.com
      - key: VOICE_WS_ALLOWED_ORIGINS
        value: https://www.hallaai.com,https://app.hallaai.com
      - key: DASHBOARD_URL
        value: https://app.hallaai.com
      - key: GATEWAY_PUBLIC_URL
        value: https://gateway.hallaai.com
      - key: REDIS_URL
        fromService:
          type: redis
          name: halla-ai-redis
          property: connectionString
      # RENDER_EXTERNAL_URL is auto-injected by Render on gateway (Twilio webhooks / WSS)
      # TWILIO_STREAM_WSS_URL auto-derived from RENDER_EXTERNAL_URL if not set (see env.ts)
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_STREAM_WSS_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_ESSENTIAL_PRODUCT_ID_MONTHLY
        sync: false
      - key: STRIPE_ESSENTIAL_PRODUCT_ID_ANNUAL
        sync: false
      - key: STRIPE_PROFESSIONAL_PRODUCT_ID_MONTHLY
        sync: false
      - key: STRIPE_PROFESSIONAL_PRODUCT_ID_ANNUAL
        sync: false
      - key: STRIPE_ENTERPRISE_PRODUCT_ID_MONTHLY
        sync: false
      - key: STRIPE_ENTERPRISE_PRODUCT_ID_ANNUAL
        sync: false
      - key: STRIPE_ESSENTIAL_PRICE_ID
        sync: false
      - key: STRIPE_ESSENTIAL_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_ESSENTIAL_OVERAGE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_PROFESSIONAL_OVERAGE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_ANNUAL_PRICE_ID
        sync: false
      - key: STRIPE_ENTERPRISE_OVERAGE_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/google/callback
      - key: HUBSPOT_CLIENT_ID
        sync: false
      - key: HUBSPOT_CLIENT_SECRET
        sync: false
      - key: HUBSPOT_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/integrations/hubspot/callback
      - key: HUBSPOT_OAUTH_SCOPES
        value: crm.objects.contacts.read crm.objects.contacts.write crm.objects.deals.read crm.objects.deals.write crm.objects.contracts.read
      - key: SALESFORCE_CLIENT_ID
        sync: false
      - key: SALESFORCE_CLIENT_SECRET
        sync: false
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/integrations/slack/callback
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: PIPEDRIVE_CLIENT_ID
        sync: false
      - key: PIPEDRIVE_CLIENT_SECRET
        sync: false
      - key: FRESHSALES_CLIENT_ID
        sync: false
      - key: FRESHSALES_CLIENT_SECRET
        sync: false
      - key: FRESHSALES_OAUTH_SCOPES
        value: freshsales.contacts.create freshsales.contacts.upsert freshsales.contacts.filters.view freshsales.selectors.view
      - key: JOBBER_CLIENT_ID
        sync: false
      - key: JOBBER_CLIENT_SECRET
        sync: false
      - key: JOBBER_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/integrations/jobber/callback
      - key: JOBBER_API_VERSION
        value: "2025-04-16"
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_TENANT_ID
        value: common
      - key: MS_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/outlook/callback
      - key: CALENDLY_CLIENT_ID
        sync: false
      - key: CALENDLY_CLIENT_SECRET
        sync: false
      - key: CALENDLY_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/calendly/callback
      - key: ACUITY_CLIENT_ID
        sync: false
      - key: ACUITY_CLIENT_SECRET
        sync: false
      - key: ACUITY_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/acuity/callback
      # WhatsApp Business (META) — primary channel for GCC market
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: PG_POOL_MAX
        value: "8"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: hello@hallaai.com
      - key: VOICE_INTERNAL_API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SENTRY_DSN
        sync: false
      - key: PROMETHEUS_PORT
        value: "9090"
      - key: ENABLE_PUBLIC_METRICS
        value: "false"
      # Localisation defaults
      - key: DEFAULT_TIMEZONE
        value: Asia/Dubai
      - key: DEFAULT_CURRENCY
        value: AED
      - key: DEFAULT_LANGUAGE
        value: ar-SA

redis:
  - name: halla-ai-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction
