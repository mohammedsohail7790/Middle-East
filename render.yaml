# Halla AI — Render Blueprint (production)
# Domain: hallaai.com | Market: GCC / Middle East
# deploy-refresh: 2026-08-12
# Deploy: Render Dashboard → New → Blueprint → connect this repo
#
# Services created:
#   halla-ai-gateway  — API + Twilio webhooks + WebSocket voice (Render, FREE plan: sleeps after ~15 min idle,
#                       first request then takes ~50 s; keep it awake with an uptime pinger on /ready or move to
#                       the `starter` plan before taking real calls)
# halla-ai-redis    — FREE Render Key Value (one free Key Value per workspace; keep staging on its external Upstash
#                       Redis, never share a Redis between staging and production). Internal URL, not persistent.
#
# Dashboard (app): deploy on Vercel → app.hallaai.com
# Marketing site:  deploy on Netlify → www.hallaai.com

services:
  - type: web
    name: halla-ai-gateway
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build:gateway
    startCommand: npm run start:gateway
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3003
      - key: PGSSLMODE
        value: require
      - key: ENABLE_VOICE_AGENT
        value: "true"
      - key: ENABLE_KNOWLEDGE_INGESTION
        value: "true"
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_TIMEOUT_MS
        value: 5000
      - key: VOICE_SILENCE_TIMEOUT_MS
        value: 800
      - key: VOICE_MAX_CALL_DURATION_MS
        value: 900000
      - key: VOICE_MAX_TOKENS_PER_CALL
        value: 5000
      - key: VOICE_MAX_SILENCE_PROMPTS
        value: 3
      - key: VOICE_RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: VOICE_RATE_LIMIT_MAX
        value: 60
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: VOICE_WS_ALLOWED_IPS
        value: ""
      - key: TWILIO_ALLOWED_IPS
        value: ""
      # Halla AI production domains
      - key: ALLOWED_ORIGINS
        value: https://www.hallaai.com,https://hallaai.com,https://app.hallaai.com
      - key: VOICE_WS_ALLOWED_ORIGINS
        value: https://www.hallaai.com,https://app.hallaai.com
      - key: DASHBOARD_URL
        value: https://app.hallaai.com
      - key: GATEWAY_PUBLIC_URL
        value: https://gateway.hallaai.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: halla-ai-redis
          property: connectionString
      # RENDER_EXTERNAL_URL is auto-injected by Render on gateway (Twilio webhooks / WSS)
      # TWILIO_STREAM_WSS_URL auto-derived from RENDER_EXTERNAL_URL if not set (see env.ts)
      # Optional integrations are intentionally NOT prompted at first deploy (pilot needs only the keys below).
      # Add them later in Dashboard -> Environment: STRIPE_*, GOOGLE_*, HUBSPOT_*, SALESFORCE_*, CLIO_*, COPPER_*,
      # SERVICETITAN_*, SQUARE_*, SLACK_*, ZOHO_*, PIPEDRIVE_*, FRESHSALES_*, JOBBER_*, MS_*, CALENDLY_*, ACUITY_*,
      # WHATSAPP_*, SMTP_*, RESEND_API_KEY, DEEPGRAM_API_KEY, ELEVENLABS_API_KEY, SENTRY_DSN, TWILIO_STREAM_WSS_URL
      # (derived from RENDER_EXTERNAL_URL when unset).
      - key: DATABASE_URL
        sync: false
      - key: GATEWAY_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/google/callback
      - key: HUBSPOT_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/integrations/hubspot/callback
      - key: HUBSPOT_OAUTH_SCOPES
        value: crm.objects.contacts.read crm.objects.contacts.write crm.objects.deals.read crm.objects.deals.write crm.objects.contracts.read
      - key: SALESFORCE_LOGIN_URL
        value: https://login.salesforce.com
      - key: CLIO_OAUTH_SCOPES
        value: openid
      # Generated by Render for this service only (base64, 256-bit = the 32 bytes the key must decode to).
      - key: INTEGRATION_CREDENTIALS_KEY
        generateValue: true
      - key: SLACK_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/integrations/slack/callback
      - key: FRESHSALES_OAUTH_SCOPES
        value: freshsales.contacts.create freshsales.contacts.upsert freshsales.contacts.filters.view freshsales.selectors.view
      - key: JOBBER_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/integrations/jobber/callback
      - key: JOBBER_API_VERSION
        value: "2025-04-16"
      - key: MS_TENANT_ID
        value: common
      - key: MS_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/outlook/callback
      - key: CALENDLY_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/calendly/callback
      - key: ACUITY_REDIRECT_URI
        value: https://gateway.hallaai.com/api/v1/calendar/acuity/callback
      # WhatsApp Business (META) — primary channel for GCC market
      - key: PG_POOL_MAX
        value: "8"
      - key: EMAIL_FROM
        value: hello@hallaai.com
      - key: VOICE_INTERNAL_API_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PROMETHEUS_PORT
        value: "9090"
      - key: ENABLE_PUBLIC_METRICS
        value: "false"
      # Localisation defaults
      - key: DEFAULT_TIMEZONE
        value: Asia/Dubai
      - key: DEFAULT_CURRENCY
        value: AED
      - key: DEFAULT_LANGUAGE
        value: ar-SA

  # Free Key Value (one per workspace; none exists yet). Internal URL, same region as the gateway. Not persistent
  # (free tier): queued jobs are lost on restart.
  - type: keyvalue
    name: halla-ai-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
