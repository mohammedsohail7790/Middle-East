name: Keep gateway warm

# The production gateway sleeps after ~15 minutes idle; the first dashboard load
# afterwards waits 60-80s. A health ping every 10 minutes keeps it awake.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping gateway /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 https://gateway.hallaai.com/health
