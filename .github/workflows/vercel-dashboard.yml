# Validates the dashboard build used by Vercel (monorepo root install).
name: Vercel dashboard build

on:
  push:
    branches: [main, master, cursor/vercel-dashboard-production]
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - "apps/dashboard/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_GATEWAY_API_URL: https://call-iq-gateway.onrender.com
      NEXT_PUBLIC_GATEWAY_WS_URL: wss://call-iq-gateway.onrender.com
      NEXT_PUBLIC_SITE_URL: https://www.calliqlabs.com
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:dashboard
