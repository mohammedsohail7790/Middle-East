global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: halla-ai-gateway
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - gateway:3003
    params:
      format: ['prometheus']

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/*.yml
