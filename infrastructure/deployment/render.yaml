# Render.com Production Deployment Configuration
# Multi-environment deployment with autoscaling and zero-downtime rollout

services:
  # ============================================================================
  # GATEWAY SERVICE (Primary Application)
  # ============================================================================
  - type: web
    name: call-iq-gateway-production
    runtime: node
    region: oregon
    plan: pro # Pro plan for autoscaling
    branch: main
    buildCommand: cd apps/gateway && npm install && npm run build
    startCommand: cd apps/gateway && npm start
    healthCheckPath: /health
    
    # Autoscaling configuration
    autoDeploy: true
    numInstances: 2 # Minimum instances
    scaling:
      minInstances: 2
      maxInstances: 10
      targetMemoryPercent: 80
      targetCPUPercent: 70
    
    # Zero-downtime deployment
    preDeployCommand: echo "Pre-deployment health check"
    
    # Environment variables
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: PORT
        value: 3003
      
      - key: LOG_LEVEL
        value: info
      
      - key: ENABLE_METRICS
        value: true
      
      - key: ENABLE_SENTRY
        value: true
      
      # Database (from Supabase)
      - key: DATABASE_URL
        sync: false # Set in Render dashboard
      
      - key: GATEWAY_DATABASE_URL
        sync: false
      
      # Redis (from Render Redis)
      - key: REDIS_URL
        fromService:
          type: redis
          name: call-iq-redis-production
          property: connectionString
      
      # OpenAI
      - key: OPENAI_API_KEY
        sync: false
      
      # Twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      
      - key: TWILIO_AUTH_TOKEN
        sync: false
      
      # Stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      
      # JWT
      - key: JWT_SECRET
        sync: false
      
      # Internal API keys
      - key: VOICE_INTERNAL_API_KEY
        sync: false
      
      - key: ADMIN_API_KEY
        sync: false
      
      # CORS
      - key: ALLOWED_ORIGINS
        value: https://app.calliq.ai,https://dashboard.calliq.ai
      
      # Rate limiting
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000 # 15 minutes
      
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      
      # Sentry
      - key: SENTRY_DSN
        sync: false
      
      - key: SENTRY_ENVIRONMENT
        value: production
      
      # Feature flags
      - key: ENABLE_KNOWLEDGE_INGESTION
        value: true
      
      - key: ENABLE_VOICE_CLONING
        value: true

  # ============================================================================
  # STAGING ENVIRONMENT
  # ============================================================================
  - type: web
    name: call-iq-gateway-staging
    runtime: node
    region: oregon
    plan: starter
    branch: staging
    buildCommand: cd apps/gateway && npm install && npm run build
    startCommand: cd apps/gateway && npm start
    healthCheckPath: /health
    
    envVars:
      - key: NODE_ENV
        value: staging
      
      - key: PORT
        value: 3003
      
      - key: LOG_LEVEL
        value: debug
      
      - key: REDIS_URL
        fromService:
          type: redis
          name: call-iq-redis-staging
          property: connectionString
      
      - key: SENTRY_ENVIRONMENT
        value: staging
      
      - key: ALLOWED_ORIGINS
        value: https://staging.calliq.ai,http://localhost:3000

  # ============================================================================
  # REDIS (Production)
  # ============================================================================
  - type: redis
    name: call-iq-redis-production
    region: oregon
    plan: pro # 5GB, high availability
    ipAllowList: [] # Allow all (secured by password)
    
  # ============================================================================
  # REDIS (Staging)
  # ============================================================================
  - type: redis
    name: call-iq-redis-staging
    region: oregon
    plan: starter # 256MB
    ipAllowList: []

  # ============================================================================
  # BACKGROUND WORKER (BullMQ)
  # ============================================================================
  - type: worker
    name: call-iq-worker-production
    runtime: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: cd apps/gateway && npm install && npm run build
    startCommand: cd apps/gateway && node dist/apps/gateway/src/workers/integration-worker.js
    
    envVars:
      - key: NODE_ENV
        value: production
      
      - key: REDIS_URL
        fromService:
          type: redis
          name: call-iq-redis-production
          property: connectionString
      
      - key: DATABASE_URL
        sync: false

# ============================================================================
# DEPLOYMENT STRATEGY
# ============================================================================
# 
# Production Deployment Flow:
# 1. Code merged to main branch
# 2. Render builds new image
# 3. Health check on new instance
# 4. Gradual traffic shift (blue/green)
# 5. Old instances drained gracefully
# 6. Rollback if health checks fail
#
# Zero-Downtime Guarantees:
# - Minimum 2 instances always running
# - Health checks before traffic routing
# - Graceful shutdown (30s drain period)
# - WebSocket session migration
# - No dropped calls during deployment
#
# Rollback Strategy:
# - Automatic rollback on health check failure
# - Manual rollback via Render dashboard
# - Previous image retained for 7 days
# - Database migrations are forward-compatible
#
# ============================================================================
