# Docker Compose - Production-like Local Environment
# For testing production deployment locally

version: '3.8'

services:
  # ============================================================================
  # GATEWAY (Load Balanced)
  # ============================================================================
  gateway-1:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    container_name: calliq-gateway-1
    environment:
      - NODE_ENV=production
      - PORT=3003
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INSTANCE_ID=gateway-1
      - ENABLE_METRICS=true
    ports:
      - "3003:3003"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - calliq-network

  gateway-2:
    build:
      context: ../../
      dockerfile: apps/gateway/Dockerfile
    container_name: calliq-gateway-2
    environment:
      - NODE_ENV=production
      - PORT=3003
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INSTANCE_ID=gateway-2
      - ENABLE_METRICS=true
    ports:
      - "3004:3003"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - calliq-network

  # ============================================================================
  # LOAD BALANCER (NGINX)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: calliq-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway-1
      - gateway-2
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - calliq-network

  # ============================================================================
  # REDIS (High Availability)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: calliq-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - calliq-network

  # ============================================================================
  # PROMETHEUS (Metrics Collection)
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: calliq-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - calliq-network

  # ============================================================================
  # GRAFANA (Dashboards)
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: calliq-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
      - ../config/grafana:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - calliq-network

  # ============================================================================
  # REDIS EXPORTER (Prometheus Metrics)
  # ============================================================================
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: calliq-redis-exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - calliq-network

networks:
  calliq-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
