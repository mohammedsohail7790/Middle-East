# Scale event consumers independently from gateway (BullMQ / stream workers).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: call-iq-event-consumers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: call-iq-event-consumers
  template:
    metadata:
      labels:
        app: call-iq-event-consumers
    spec:
      containers:
        - name: consumer
          image: call-iq-gateway:latest
          env:
            - name: CALLIQ_P2_EVENT_BUS
              value: "true"
            - name: CALLIQ_CONSUMER_ONLY
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: call-iq-consumers-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: call-iq-event-consumers
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
