# Halla AI Gateway — production Kubernetes scaffold
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halla-ai-gateway
  labels:
    app: halla-ai-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: halla-ai-gateway
  template:
    metadata:
      labels:
        app: halla-ai-gateway
    spec:
      containers:
        - name: gateway
          image: halla-ai-gateway:latest
          ports:
            - containerPort: 3003
          envFrom:
            - secretRef:
                name: halla-ai-gateway-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3003
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: halla-ai-gateway
spec:
  selector:
    app: halla-ai-gateway
  ports:
    - port: 80
      targetPort: 3003
  type: ClusterIP
